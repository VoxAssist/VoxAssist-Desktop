name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from csproj
        id: get-version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' VoxAssist.Desktop.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Check if tag exists
        id: check
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Version v$VERSION already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Version v$VERSION is new. Proceeding with release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            output_name: VoxAssist-Linux
          - os: windows-latest
            rid: win-x64
            output_name: VoxAssist-Windows.exe
          - os: macos-latest
            rid: osx-x64
            output_name: VoxAssist-macOS-Intel
          - os: macos-latest
            rid: osx-arm64
            output_name: VoxAssist-macOS-AppleSilicon

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          chmod +x build-appimage.sh
          ./build-appimage.sh
          mkdir -p ./publish
          mv VoxAssist-x86_64.AppImage ./publish/${{ matrix.output_name }}.AppImage
        else
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish
        fi

    - name: Rename Output
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv ./publish/VoxAssist.Desktop.exe ./publish/${{ matrix.output_name }}
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Already handled by AppImage script
          echo "Linux AppImage already named correctly"
        else
          mv ./publish/VoxAssist.Desktop ./publish/${{ matrix.output_name }}
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}
        path: ./publish/VoxAssist-*
        if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.check-version.outputs.version }}
        name: Release v${{ needs.check-version.outputs.version }}
        files: |
          ./artifacts/linux-x64/VoxAssist-Linux.AppImage
          ./artifacts/win-x64/VoxAssist-Windows.exe
          ./artifacts/osx-x64/VoxAssist-macOS-Intel
          ./artifacts/osx-arm64/VoxAssist-macOS-AppleSilicon
        generate_release_notes: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
