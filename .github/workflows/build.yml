name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            output_name: VoxAssist-Linux
          - os: windows-latest
            rid: win-x64
            output_name: VoxAssist-Windows.exe
          - os: macos-latest
            rid: osx-x64
            output_name: VoxAssist-macOS-Intel
          - os: macos-latest
            rid: osx-arm64
            output_name: VoxAssist-macOS-AppleSilicon

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: |
        dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Rename Output
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv ./publish/VoxAssist.Desktop.exe ./publish/${{ matrix.output_name }}
        else
          mv ./publish/VoxAssist.Desktop ./publish/${{ matrix.output_name }}
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}
        path: ./publish/${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/linux-x64/VoxAssist-Linux
          ./artifacts/win-x64/VoxAssist-Windows.exe
          ./artifacts/osx-x64/VoxAssist-macOS-Intel
          ./artifacts/osx-arm64/VoxAssist-macOS-AppleSilicon
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
